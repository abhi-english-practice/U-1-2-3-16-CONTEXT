/* Reading in context — additional third mode */
.reading-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}

/* ABHIUYEN — original passage recordings player */

r work alone?"},{"n":6,"en":"upload a post","vi":"tải hoặc đăng một bài viết lên mạng","a":"I uploaded a post about our school trip last night.","b":"She checked the photos before uploading a post to the class page."},{"n":7,"en":"suffer from stress","vi":"bị căng thẳng","a":"Some students suffer from stress before important exams.","b":"He suffered from stress when he had too much work to do."},{"n":8,"en":"meet parents' expectations","vi":"đáp ứng kỳ vọng của cha mẹ","a":"She works hard because she wants to meet her parents' expectations.","b":"He worries that his exam results won't meet his parents' expectations."},{"n":9,"en":"stay away from bullies","vi":"tránh xa những người bắt nạt","a":"My brother told me to stay away from the bullies and speak to a teacher.","b":"She stayed away from the bullies and walked home with her friends."},{"n":10,"en":"share personal information","vi":"chia sẻ thông tin cá nhân","a":"Don't share personal information with people you meet online.","b":"Ask me before you share my personal information with anyone."},{"n":11,"en":"participate in club activities","vi":"tham gia các hoạt động câu lạc bộ","a":"All members can participate in club activities on Friday afternoons.","b":"I couldn't participate in the club activities because I was ill."},{"n":12,"en":"share your feelings","vi":"chia sẻ cảm xúc của mình","a":"It can help to share your feelings with someone you trust.","b":"You don't have to share your feelings with the whole class."},{"n":13,"en":"concentrate on schoolwork","vi":"tập trung vào việc học","a":"I turn off my phone so I can concentrate on my schoolwork.","b":"She finds it hard to concentrate on schoolwork in a noisy room."},{"n":14,"en":"a user-friendly website","vi":"một trang web dễ sử dụng","a":"The library has a user-friendly website with a clear search button.","b":"We need a user-friendly website that parents can use on their phones."},{"n":15,"en":"join a school forum","vi":"tham gia diễn đàn của trường","a": line account to see if the payment had arrived.","b":"Check your online account for any messages from the course organiser."},{"n":36,"en":"keep calm","vi":"giữ bình tĩnh","a":"Try to keep calm if you forget a word during the test.","b":"She kept calm and asked the driver where to get off."}],"3":[{"n":1,"en":"prevent infectious diseases","vi":"ngăn ngừa các bệnh truyền nhiễm","a":"The class discussed simple ways to prevent infectious diseases.","b":"Clean water is important in preventing infectious diseases."},{"n":2,"en":"improve physical fitness","vi":"cải thiện thể lực","a":"I joined the swimming club to improve my physical fitness.","b":"The course includes exercises to improve physical fitness."},{"n":3,"en":"resolve family conflicts","vi":"giải quyết những mâu thuẫn trong gia đình","a":"We try to resolve family conflicts by talking things through.","b":"Listening carefully can help people resolve family conflicts."},{"n":4,"en":"limit screen time","vi":"giới hạn thời gian sử dụng thiết bị có màn hình","a":"My parents limit my screen time on school nights.","b":"I use a timer to limit screen time when I'm studying."},{"n":5,"en":"take responsibility","vi":"nhận hoặc chịu trách nhiệm","a":"I broke the window, so I need to take responsibility.","b":"Each group member must take responsibility for one part of the project."},{"n":6,"en":"bridge the generation gap","vi":"thu hẹp sự khác biệt và thiếu thấu hiểu giữa các thế hệ","a":"Sharing stories can help bridge the generation gap.","b":"The school invited grandparents to join an activity to bridge the generation gap."},{"n":7,"en":"receive medical treatment","vi":"được điều trị y tế","a":"He received medical treatment for his injured knee.","b":"She had to travel to the city to receive medical treatment."},{"n":8,"en":"have a balanced diet","vi":"có chế độ ăn cân đối","a":"I try to have a balanced diet, even when I'm busy.","b":"It's easier to have a balanced diet when we plan our meals."},{"n":9,"en":"share common characteristics","vi":"có chung những đặc điểm","a":"These two plants share common characteristics, such as small leaves.","b":"People in the same generation may share common characteristics."},{"n":10,"en":"avoid unhealthy habits","vi":"tránh những thói quen có hại cho sức khỏe","a":"I find it easier to avoid unhealthy habits when I follow a routine.","b":"The lesson asked us to explain how teenagers can avoid unhealthy habits."},{"n":11,"en":"pass down cultural values","vi":"truyền lại các giá trị văn hóa cho thế hệ sau","a":"Families often pass down cultural values through stories.","b":"Our grandparents pass down cultural values when they teach us about festivals."},{"n":12,"en":"live in an extended family","vi":"sống trong đại gia đình gồm cả họ hàng ngoài cha mẹ và con","a":"I live in an extended family with my grandparents and aunt.","b":"She enjoys living in an extended family because someone is usually at home."},{"n":13,"en":"give up smoking","vi":"bỏ hút thuốc lá","a":"My uncle gave up smoking when his daughter was born.","b":"He has tried to give up smoking several times."},{"n":14,"en":"come up with new ideas","vi":"nghĩ ra những ý tưởng mới","a":"We need to come up with new ideas for the school fair.","b":"Mai often comes up with new ideas when our group gets stuck."},{"n":15,"en":"take regular exercise","vi":"tập thể dục đều đặn","a":"My dad takes regular exercise by walking every morning.","b":"Do you find time to take regular exercise during the school term?"},{"n":16,"en":"suffer from food poisoning","vi":"bị ngộ độc thực phẩm","a":"Two of the guests suffered from food poisoning after the party.","b":"He missed the trip because he was suffering from food poisoning."},{"n":17,"en":"recover from an illness","vi":"hồi phục sau một đợt ốm hoặc bệnh","a":"She's still recovering from an illness and gets tired easily.","b":"He stayed with his parents while he recovered from an illness."},{"n":18,"en":"value honesty","vi":"coi trọng tính trung thực","a":"My parents value honesty, even when I've made a mistake.","b":"I value honesty in a friend more than popularity."},{"n":19,"en":"cope with difficulties","vi":"ứng phó và xoay xở trước những khó khăn","a":"Her teacher helped her cope with difficulties at her new school.","b":"I've learnt to ask for help when I can't cope with difficulties alone."},{"n":20,"en":"do press-ups","vi":"tập chống đẩy hoặc hít đất","a":"He does press-ups before football practice.","b":"I could only do five press-ups when I first joined the gym."},{"n":21,"en":"cut down on sugar","vi":"giảm lượng đường tiêu thụ","a":"I'm trying to cut down on sugar, so I don't add it to tea.","b":"She cut down on sugar by drinking water instead of fizzy drinks."},{"n":22,"en":"understand generational differences","vi":"hiểu những khác biệt giữa các thế hệ","a":"Talking to my grandparents helps me understand generational differences.","b":"We interviewed older relatives to understand generational differences in daily life."},{"n":23,"en":"eat nutritious food","vi":"ăn thực phẩm giàu dinh dưỡng","a":"I try to eat nutritious food rather than skip lunch.","b":"The students planned a menu to show how to eat nutritious food on a small budget."},{"n":24,"en":"respect different opinions","vi":"tôn trọng những ý kiến khác nhau","a":"We can respect different opinions without changing our own views.","b":"Our teacher reminds us to respect different opinions during class discussions."},{"n":25,"en":"become more independent","vi":"trở nên tự lập hơn","a":"I became more independent when I learnt to cook.","b":"Travelling to school by bus helped her become more independent."},{"n":26,"en":"protect against flu","vi":"giúp bảo vệ khỏi bệnh cúm","a":"The nurse explained how vaccines help protect against flu.","b":"We asked the doctor about ways to protect against flu."},{"n":27,"en":"build muscle strength","vi":"tăng sức mạnh cơ bắp","a":"The coach showed us exercises to build muscle strength.","b":"He's doing gentle exercises to build muscle strength after his injury."},{"n":28,"en":"have an argument with parents","vi":"tranh cãi với cha mẹ","a":"I had an argument with my parents about coming home late.","b":"She doesn't want to have another argument with her parents about her phone."},{"n":29,"en":"get enough sleep","vi":"ngủ đủ giấc","a":"I find it hard to get enough sleep during exam week.","b":"Do you get enough sleep before an early lesson?"},{"n":30,"en":"learn from older generations","vi":"học hỏi từ các thế hệ đi trước","a":"We can learn from older generations by asking about their lives.","b":"I enjoy learning from older generations, especially when they teach me practical skills."},{"n":31,"en":"adapt to changes","vi":"thích nghi với những thay đổi","a":"It took me a few weeks to adapt to changes in my timetable.","b":"My grandparents have adapted to changes in technology surprisingly well."},{"n":32,"en":"improve life expectancy","vi":"cải thiện tuổi thọ trung bình kỳ vọng","a":"Better living conditions can help improve life expectancy.","b":"Our project looks at how cleaner water helped improve life expectancy."},{"n":33,"en":"check food ingredients","vi":"kiểm tra các thành phần trong thực phẩm","a":"I always check food ingredients because I'm allergic to nuts.","b":"Check the food ingredients before you buy snacks for the class."},{"n":34,"en":"hold traditional views","vi":"có hoặc giữ những quan điểm truyền thống","a":"My grandfather holds traditional views about family life.","b":"Some parents hold traditional views about the jobs their children should choose."},{"n":35,"en":"lead a healthy lifestyle","vi":"duy trì một lối sống lành mạnh","a":"I find it hard to lead a healthy lifestyle when I work late.","b":"My sister tries to lead a healthy lifestyle without giving up all her favourite foods."},{"n":36,"en":"grow up in a nuclear family","vi":"lớn lên trong gia đình chỉ gồm cha mẹ và con","a":"I grew up in a nuclear family with my parents and brother.","b":"Did you grow up in a nuclear family or an extended family?"}],"4":[{"n":1,"en":"move to an urban centre","vi":"chuyển đến một trung tâm đô thị","a":"My cousin moved to an urban centre to find work.","b":"Some young people move to urban centres after leaving school."},{"n":2,"en":"protect people's privacy","vi":"bảo vệ quyền riêng tư của mọi người","a":"The app has new rules to protect people's privacy.","b":"Schools should protect people's privacy when sharing photos online."},{"n":3,"en":"encourage social interaction","vi":"khuyến khích mọi người giao tiếp và tương tác","a":"The new seating area is designed to encourage social interaction.","b":"Group games can encourage social interaction among new students."},{"n":4,"en":"computer-controlled systems","vi":"các hệ thống được điều khiển bằng máy tính","a":"The factory uses computer-controlled systems to pack its products.","b":"Computer-controlled systems can turn off lights in empty rooms."},{"n":5,"en":"protect the environment","vi":"bảo vệ môi trường","a":"We joined a local group to help protect the environment.","b":"Using fewer plastic bags is one way to protect the environment."},{"n":6,"en":"improve the quality of life","vi":"cải thiện chất lượng cuộc sống","a":"A quieter street would improve the quality of life for local families.","b":"The new bus service has improved the quality of life in our area."},{"n":7,"en":"reduce air pollution","vi":"giảm ô nhiễm không khí","a":"The city wants to reduce air pollution near schools.","b":"Using cleaner buses could help reduce air pollution."},{"n":8,"en":"reduce our carbon footprint","vi":"giảm lượng khí thải các-bon từ hoạt động của chúng ta","a":"We can reduce our carbon footprint by driving less.","b":"Our class discussed how to reduce our carbon footprint at home."},{"n":9,"en":"monitor energy use","vi":"theo dõi lượng năng lượng sử dụng","a":"The school uses an app to monitor energy use.","b":"We installed a small device to monitor energy use in the kitchen."},{"n":10,"en":"create green spaces","vi":"tạo thêm không gian xanh","a":"The council plans to create green spaces beside the river.","b":"Residents want to create green spaces on unused land."},{"n":11,"en":"operate efficiently","vi":"vận hành hiệu quả và ít lãng phí","a":"The new heating system operates efficiently even in cold weather.","b":"Machines need regular care to operate efficiently."},{"n":12,"en":"control traffic flow","vi":"điều tiết luồng giao thông","a":"New traffic lights help control traffic flow near the station.","b":"The police controlled traffic flow while the road was closed."},{"n":13,"en":"develop a sense of community","vi":"hình thành cảm giác gắn bó và thuộc về cộng đồng","a":"A shared garden can help neighbours develop a sense of community.","b":"We developed a sense of community by organising events together."},{"n":14,"en":"encourage walking and cycling","vi":"khuyến khích việc đi bộ và đi xe đạp","a":"Safer roads would encourage walking and cycling.","b":"The school has a weekly event to encourage walking and cycling."},{"n":15,"en":"travel during rush hour","vi":"đi lại vào giờ cao điểm","a":"I avoid travelling during rush hour if I can.","b":"It takes much longer to travel during rush hour."},{"n":16,"en":"meet city dwellers","vi":"gặp gỡ những người sống ở thành thị","a":"During the project, we met city dwellers of different ages.","b":"We visited the market to meet city dwellers and ask about local life."},{"n":17,"en":"provide more pedestrian zones","vi":"bố trí thêm khu vực dành cho người đi bộ","a":"The council plans to provide more pedestrian zones near the shops.","b":"Local families want the city to provide more pedestrian zones."},{"n":18,"en":"make cities more liveable","vi":"làm cho các thành phố đáng sống hơn","a":"Cleaner streets and safer roads can make cities more liveable.","b":"The students suggested ways to make cities more liveable for older people."},{"n":19,"en":"sustainable cities","vi":"các thành phố phát triển theo hướng bền vững","a":"Our geography project is about sustainable cities.","b":"Sustainable cities need to plan how they use water and energy."},{"n":20,"en":"collect real-time data","vi":"thu thập dữ liệu ngay khi sự việc đang diễn ra","a":"Road sensors collect real-time data about traffic.","b":"The app collects real-time data to show where buses are."},{"n":21,"en":"improve urban infrastructure","vi":"cải thiện cơ sở hạ tầng đô thị","a":"The city needs to improve urban infrastructure as its population grows.","b":"The new plan aims to improve urban infrastructure, including roads and water pipes."},{"n":22,"en":"fear the loss of privacy","vi":"lo ngại mất quyền riêng tư","a":"Some residents fear the loss of privacy when cameras are installed everywhere.","b":"People may fear the loss of privacy if an app tracks their location."},{"n":23,"en":"design roof gardens","vi":"thiết kế các khu vườn trên mái","a":"Our group designed roof gardens for three apartment buildings.","b":"The course teaches students how to design roof gardens."},{"n":24,"en":"install smart sensors","vi":"lắp đặt các cảm biến thông minh","a":"The school will install smart sensors to control the lights.","b":"Workers installed smart sensors to check the water level."},{"n":25,"en":"use clean energy","vi":"sử dụng năng lượng sạch","a":"The new building will use clean energy from solar panels.","b":"Our class asked which local schools use clean energy."},{"n":26,"en":"develop green technologies","vi":"phát triển các công nghệ giúp giảm tác động đến môi trường","a":"The company develops green technologies for homes.","b":"Students visited a lab where engineers develop green technologies."},{"n":27,"en":"use public transport","vi":"sử dụng phương tiện giao thông công cộng","a":"I use public transport because parking in the city is expensive.","b":"More people might use public transport if buses came more often."},{"n":28,"en":"interact with neighbours","vi":"giao tiếp và tương tác với hàng xóm","a":"The shared garden gives us a chance to interact with neighbours.","b":"I rarely interacted with my neighbours before I joined the local club."},{"n":29,"en":"build more cycle paths","vi":"xây thêm đường dành cho xe đạp","a":"The council has agreed to build more cycle paths near schools.","b":"We hope the city will build more cycle paths next year."},{"n":30,"en":"improve public transport","vi":"cải thiện hệ thống giao thông công cộng","a":"The town needs to improve public transport in the evenings.","b":"Adding more buses is one way to improve public transport."},{"n":31,"en":"renewable energy","vi":"năng lượng tái tạo","a":"The school uses solar panels to produce renewable energy.","b":"We learnt about wind power and other forms of renewable energy."},{"n":32,"en":"save energy","vi":"tiết kiệm năng lượng","a":"We turn off the lights at lunchtime to save energy.","b":"This washing machine uses less hot water to save energy."},{"n":33,"en":"live in a high-rise building","vi":"sống trong một tòa nhà cao tầng","a":"I live in a high-rise building near the railway station.","b":"Would you like to live in a high-rise building with a roof garden?"},{"n":34,"en":"manage public services","vi":"quản lý các dịch vụ công cộng","a":"The council uses new software to manage public services.","b":"Our project looks at how towns manage public services such as waste collection."},{"n":35,"en":"reduce traffic jams","vi":"giảm tình trạng ùn tắc giao thông","a":"A better bus service could reduce traffic jams in the town centre.","b":"The new road was built to reduce traffic jams near the bridge."},{"n":36,"en":"use a card reader","vi":"sử dụng thiết bị đọc thẻ","a":"You need to use a card reader to enter the building.","b":"The librarian showed me how to use a card reader at the desk."}],"1_layout":[[8,19,13],[31,15,2],[27,29,21],[6,10,11],[35,23,17],[4,24,33],[16,26,1],[7,32,20],[12,36,28],[3,22,9],[34,18,5],[25,14,30]],"2_layout":[[2,31,1],[8,12,17],[11,27,26],[19,23,32,3],[13,4,33],[25,10,34] 85],[71.405,72.865],[73.325,74.645],[75.045,76.805],[77.265,79.205]],"4_time":[[0.205,2.985],[3.745,6.205],[7.005,9.725],[10.585,13.165],[13.925,15.905],[16.685,19.545],[20.265,22.425],[23.265,25.665],[26.405,28.565],[29.225,31.485],[32.205,34.025],[34.825,36.845],[37.585,40.085],[40.925,43.605],[44.345,46.245],[47.005,48.745],[49.345,52.165],[52.785,54.865],[55.485,57.125],[57.805,59.865],[60.565,62.885],[63.645,65.965],[66.625,68.545],[69.185,71.425],[72.025,73.845],[74.545,76.765],[77.385,79.265],[79.965,81.885],[82.465,84.605],[85.265,87.285],[88.005,89.685],[90.305,91.565],[92.185,94.285],[94.925,96.925],[97.485,99.245],[99.825,101.485]],"1_audio":"sheet_01.mp3","2_audio":"sheet_02.mp3","3_audio":"sheet_03.mp3","4_audio":"sheet_04.mp3"}</script>
<script id="passages" type="application/json">[{"sheet":1,"grade":8,"unit":"Unit 1 · Leisure Time","title":"Different Hobbies, Strong Friendships","vi_title":"Sở thích khác nhau, tình bạn bền chặt","ids":[1,7,8,10,15,16,17,23,33],"text":"Students in my class have different hobbies, but everyone needs time to relax. Some of us **prefer outdoor activities** because running or cycling helps us **stay in shape**. Others **spend time outdoors** simply to enjoy fresh air. My best friend doesn't have to **be keen on knitting** to enjoy making things with her hands; she might **be interested in origami** instead. At weekends, we often **play board games** at my house. Even when we cannot meet, we **communicate with friends** in our class group. On Saturday afternoons, we sometimes **hang out with friends** at the park. A few classmates seem to **be crazy about puzzles**, so we organise a small puzzle challenge once a month. Our interests are different, but sharing them brings us together.","summary":"Học sinh chia sẻ những sở thích khác nhau, từ hoạt động ngoài trời đến trò chơi và thủ công.","nwords":126,"vi_full":"Học sinh trong lớp tôi có những sở thích khác nhau, nhưng ai cũng cần thời gian để thư giãn. Một số bạn thích các hoạt động ngoài trời hơn vì chạy bộ hoặc đạp xe giúp chúng tôi giữ cơ thể khỏe mạnh, cân đối. Những bạn khác dành thời gian ở ngoài trời chỉ để tận hưởng không khí trong lành. Bạn thân của tôi không nhất thiết phải mê đan len mới thích tự tay làm đồ thủ công; thay vào đó, bạn ấy có thể hứng thú với nghệ thuật gấp giấy origami. Vào cuối tuần, chúng tôi thường chơi các trò chơi trên bàn tại nhà tôi. Ngay cả khi không gặp trực tiếp được, chúng tôi vẫn liên lạc với bạn bè qua nhóm chat của lớp. Chiều thứ Bảy, đôi khi chúng tôi cùng bạn bè đi chơi ở công viên. Một vài bạn trong lớp rất mê giải đố, nên mỗi tháng chúng tôi tổ chức một thử thách giải đố nhỏ. Sở thích của mỗi người tuy khác nhau nhưng việc chia sẻ chúng khiến chúng tôi gắn bó hơn."},{"sheet":1,"grade":8,"unit":"Unit 1 · Leisure Time / Unit 2 · Life in the Countryside","title":"A Creative Weekend in the Village","vi_title":"Cuối tuần sáng tạo ở làng quê","ids":[2,13,19,21,25,26,27,29,35],"text":"Last weekend, our art club visited **a picturesque village** near the mountains. The **hospitable villagers** welcomed us into a community house and showed us their favourite crafts. We learnt to **make paper flowers** and **fold paper into shapes** for a village display. Younger children were invited to **do DIY activities**, while older students helped **make models** of traditional houses. Some visitors may **be fond of gardening**, so a local family showed them how to plant vegetables. Others wanted to **collect stamps and coins** featuring rural scenes. Before leaving, we exchanged contact details to **keep in touch** with our new friends. The trip showed us that hobbies can help people of different ages learn from one another.","summary":"Câu lạc bộ nghệ thuật khám phá nghề thủ công và kết nối với người dân trong một làng quê.","nwords":116,"vi_full":"Cuối tuần trước, câu lạc bộ mỹ thuật của chúng tôi đến thăm một ngôi làng đẹp như tranh gần vùng núi. Người dân làng hiếu khách đón chúng tôi vào nhà sinh hoạt cộng đồng và giới thiệu những món đồ thủ công mà họ yêu thích. Chúng tôi học cách làm hoa giấy và gấp giấy thành các hình để trưng bày trong làng. Các em nhỏ được mời tham gia hoạt động tự làm đồ thủ công, còn học sinh lớn hơn giúp làm mô hình nhà truyền thống. Một số du khách có thể yêu thích việc làm vườn, vì vậy một gia đình địa phương hướng dẫn họ trồng rau. Những người khác muốn sưu tầm tem và tiền xu có hình ảnh vùng nông thôn. Trước khi rời đi, chúng tôi trao đổi thông tin liên lạc để giữ liên lạc với những người bạn mới. Chuyến đi cho thấy sở thích có thể giúp mọi người ở các độ tuổi khác nhau học hỏi lẫn nhau."},{"sheet":1,"grade":8,"unit":"Unit 2 · Life in the Countryside","title":"A Day on My Grandparents’ Farm","vi_title":"Một ngày ở trang trại ông bà","ids":[3,5,6,9,12,20,22,28,36],"text":"My grandparents live on a farm where the houses seem to **be surrounded by fields**. I love **a slower pace of life** there because nobody is in a hurry. Early in the morning, I help my grandmother **collect eggs** and **feed the chickens**. My grandfather shows visitors how to **milk a cow**, but he always checks that the animal is calm. In the afternoon, my cousins and I sometimes **pick fruit in an orchard** or watch adults **catch fish in a pond**. We also help the farmers **herd the buffaloes** back to their shelters. Some children want to **ride a buffalo**, but my grandfather says they must never do so without an experienced adult. A day on the farm is full of useful lessons.","summary":"Các hoạt động quen thuộc tại trang trại cho thấy nhịp sống nông thôn và công việc chăm sóc vật nuôi.","nwords":124,"vi_full":"Ông bà tôi sống ở một trang trại, nơi những ngôi nhà dường như được bao quanh bởi đồng ruộng. Tôi yêu nhịp sống chậm rãi ở đó vì chẳng ai phải vội vàng. Sáng sớm, tôi giúp bà thu nhặt trứng và cho gà ăn. Ông tôi hướng dẫn khách cách vắt sữa bò, nhưng ông luôn kiểm tra xem con bò có bình tĩnh hay không. Buổi chiều, tôi và các anh chị em họ đôi khi hái quả trong vườn cây ăn quả hoặc xem người lớn bắt cá trong ao. Chúng tôi còn giúp nông dân lùa đàn trâu về chuồng. Một số trẻ em muốn cưỡi trâu, nhưng ông tôi nói rằng các em không bao giờ được làm như vậy nếu không có người lớn có kinh nghiệm đi cùng. Một ngày ở trang trại mang đến rất nhiều bài học bổ ích."},{"sheet":1,"grade":8,"unit":"Unit 2 · Life in the Countryside","title":"The Busy Rice Harvest","vi_title":"Mùa gặt tất bật","ids":[4,11,14,18,24,30,31,32,34],"text":"Near my village, **a vast paddy field** turns golden every autumn. Before the planting season, farmers **plough the fields** carefully. Months later, families work together to **harvest the crops**. Many villagers **enjoy the harvest season**, although it is hard work. On sunny days, people **dry rice in the sun** before storing it. Some workers **load rice onto a truck** and take it to a store, where others **unload rice from a truck**. Today, modern machines help **well-trained workers** finish these jobs more safely and efficiently. When our school visits the village, we also try **local specialities** made from freshly harvested ingredients. The harvest is not only about food; it is a time when neighbours support one another.","summary":"Đoạn đọc mô tả quá trình trồng, gặt, phơi và vận chuyển lúa trong mùa thu hoạch.","nwords":117,"vi_full":"Gần làng tôi, một cánh đồng lúa rộng mênh mông chuyển sang màu vàng óng mỗi khi thu về. Trước mùa gieo trồng, nông dân cày ruộng rất cẩn thận. Vài tháng sau, các gia đình cùng nhau thu hoạch mùa màng. Nhiều người dân làng yêu thích mùa gặt dù công việc rất vất vả. Vào những ngày nắng, mọi người phơi thóc dưới nắng trước khi đem cất giữ. Một số công nhân chất thóc lên xe tải và chở đến kho, nơi những người khác dỡ thóc từ xe tải xuống. Ngày nay, máy móc hiện đại giúp những người lao động được đào tạo bài bản hoàn thành các công việc này an toàn và hiệu quả hơn. Khi trường chúng tôi đến thăm làng, chúng tôi còn thưởng thức các món đặc sản địa phương làm từ những nguyên liệu vừa được thu hoạch. Mùa gặt không chỉ gắn với lương thực mà còn là dịp hàng xóm láng giềng hỗ trợ lẫn nhau."},{"sheet":2,"grade":9,"unit":"Unit 11 · Electronic Devices / Unit 3 · Healthy Living for Teens","title":"Being Smart Online","vi_title":"Sử dụng Internet thông minh","ids":[2,4,6,10,14,17,22,27,35],"text":"It is easy to **browse a website** or **upload a post**, but using the Internet responsibly takes practice. When choosing a learning platform, look for **a user-friendly website** with clear instructions. To **log on to an account**, use a strong password and avoid public computers if possible. You should **check an online account** for unusual activity, but you do not need to **check notifications** every few minutes. Never **share personal information** with strangers. Some teenagers worry that they might **be addicted to social media**, especially when they **spend too much time online** and forget their other interests. A simple daily screen-time plan can help students use digital tools for learning without letting them control their lives.","summary":"Nêu cách dùng mạng an toàn, bảo vệ tài khoản và hạn chế phụ thuộc mạng xã hội.","nwords":116,"vi_full":"Việc xem nội dung trên một trang web hay đăng một bài viết lên mạng rất dễ, nhưng sử dụng Internet có trách nhiệm cần được rèn luyện. Khi chọn nền tảng học tập, hãy tìm một trang web dễ sử dụng với hướng dẫn rõ ràng. Để đăng nhập vào tài khoản, hãy dùng mật khẩu mạnh và tránh máy tính công cộng nếu có thể. Bạn nên kiểm tra tài khoản trực tuyến để phát hiện hoạt động bất thường, nhưng không cần xem thông báo vài phút một lần. Đừng bao giờ chia sẻ thông tin cá nhân với người lạ. Một số thanh thiếu niên lo rằng mình có thể quá phụ thuộc vào mạng xã hội, đặc biệt khi họ dành quá nhiều thời gian trên mạng và quên đi những sở thích khác. Một kế hoạch giới hạn thời gian dùng màn hình đơn giản mỗi ngày có thể giúp học sinh sử dụng công cụ số để học mà không để chúng chi phối cuộc sống."},{"sheet":2,"grade":9,"unit":"Unit 1 · Local Community / Unit 5 · Our Experiences","title":"Finding Friends Through School Clubs","vi_title":"Kết bạn qua các câu lạc bộ","ids":[1,5,11,15,16,18,25,29,33],"text":"At the start of the school year, Minh was shy and worried about fitting in. His teacher suggested that he **join a chess club** because he enjoyed solving problems. Soon, he began to **participate in club activities** and discovered that many students **have common interests**. He also decided to **join a school forum** to learn about other events. There, he could **connect with classmates** and find teammates who **enjoy group activities**. Some friends invited him to **practise with a coach** after school and **take part in a competition**. Although the team did not win, Minh was pleased to **make new friends**. He learnt that school clubs offer more than prizes: they help students build confidence and a sense of belonging.","summary":"Một học sinh tìm được bạn bè và sự tự tin thông qua hoạt động câu lạc bộ.","nwords":120,"vi_full":"Đầu năm học, Minh khá nhút nhát và lo lắng về việc hòa nhập. Giáo viên gợi ý Minh tham gia câu lạc bộ cờ vua vì em thích giải quyết vấn đề. Chẳng bao lâu, em bắt đầu tham gia các hoạt động câu lạc bộ và nhận ra nhiều học sinh có những sở thích chung. Minh còn quyết định tham gia diễn đàn của trường để tìm hiểu các sự kiện khác. Ở đó, em có thể kết nối với bạn cùng lớp và tìm đồng đội thích hoạt động nhóm. Một vài người bạn rủ em luyện tập cùng huấn luyện viên sau giờ học và tham gia một cuộc thi. Dù đội không thắng, Minh vẫn vui vì đã kết bạn mới. Em nhận ra câu lạc bộ trường học mang lại nhiều điều hơn các giải thưởng: chúng giúp học sinh xây dựng sự tự tin và cảm giác mình thuộc về một tập thể."},{"sheet":2,"grade":9,"unit":"Unit 3 · Healthy Living for Teens","title":"You Are Not Alone","vi_title":"Bạn không đơn độc","ids":[7,9,12,19,20,21,31,32,34],"text":"Exams and friendships can be difficult for teenagers. Some students **feel under pressure** to get high marks and may **suffer from stress**. Others struggle to **deal with peer pressure** or **feel lonely** when they are left out. At school, everyone deserves **a sense of safety**. If someone is unkind, you should **stay away from bullies** when possible and tell a trusted adult. Schools also need clear ways to **deal with bullying**, including online bullying. It can be difficult to **share your feelings**, but talking to a friend, parent or teacher is often a good first step. Remember that you can **ask for advice** before a small problem becomes a serious one.","summary":"Bài đọc đề cập áp lực tuổi teen, bắt nạt và cách tìm kiếm sự hỗ trợ.","nwords":111,"vi_full":"Các kỳ thi và những mối quan hệ bạn bè có thể khiến thanh thiếu niên gặp khó khăn. Một số học sinh cảm thấy bị áp lực phải đạt điểm cao và có thể bị căng thẳng. Những em khác chật vật ứng phó với áp lực từ bạn bè đồng trang lứa hoặc cảm thấy cô đơn khi bị bỏ rơi. Ở trường, mọi người đều xứng đáng có cảm giác an toàn. Nếu ai đó có hành vi không tốt, bạn nên tránh xa những người bắt nạt khi có thể và báo cho một người lớn đáng tin cậy. Nhà trường cũng cần có những biện pháp rõ ràng để xử lý việc bắt nạt, kể cả bắt nạt trên mạng. Chia sẻ cảm xúc của mình đôi khi không dễ, nhưng trò chuyện với bạn bè, cha mẹ hoặc giáo viên thường là bước đầu tiên hữu ích. Hãy nhớ rằng bạn có thể xin lời khuyên trước khi một vấn đề nhỏ trở nên nghiêm trọng."},{"sheet":2,"grade":9,"unit":"Unit 3 · Healthy Living for Teens","title":"A Better Plan for Exam Week","vi_title":"Lập kế hoạch tốt hơn cho tuần thi","ids":[3,8,13,23,24,26,28,30,36],"text":"Lan has three tests next week. Many students want to **meet parents' expectations**, but Lan knows that high marks are not everything. Her teacher writes a useful reminder on the board: ‘**manage your time**’. Lan follows this advice by making a realistic study plan. She needs to **prepare for a midterm exam** without giving up sleep or exercise. To **concentrate on schoolwork**, she studies in a quiet room and takes short breaks to **improve concentration**. She may **send a message** to a classmate when she does not understand a question. She does not want to **neglect schoolwork**, but she also needs to **balance study and leisure**. Before each exam, she takes a slow breath and reminds herself to **keep calm**.","summary":"Đoạn đọc hướng dẫn cách quản lý thời gian, học tập và giữ bình tĩnh trước kỳ thi.","nwords":120,"vi_full":"Tuần tới Lan có ba bài kiểm tra. Nhiều học sinh muốn đáp ứng kỳ vọng của cha mẹ, nhưng Lan hiểu rằng điểm cao không phải là tất cả. Giáo viên viết một lời nhắc hữu ích lên bảng: ‘Hãy quản lý thời gian của mình’. Lan làm theo lời khuyên này bằng cách lập một kế hoạch học tập thực tế. Em cần chuẩn bị cho bài thi giữa kỳ mà không từ bỏ giấc ngủ hay việc tập thể dục. Để tập trung vào bài vở, em học trong một căn phòng yên tĩnh và nghỉ giải lao ngắn để cải thiện khả năng tập trung. Em có thể gửi tin nhắn cho bạn cùng lớp khi không hiểu một câu hỏi. Lan không muốn sao nhãng việc học, nhưng em cũng cần cân bằng học tập và giải trí. Trước mỗi bài thi, em hít thở chậm rồi tự nhắc mình giữ bình tĩnh."},{"sheet":3,"grade":11,"unit":"Unit 1 · A Long and Healthy Life","title":"Small Habits, Better Health","vi_title":"Thói quen nhỏ, sức khỏe tốt","ids":[1,8,13,15,21,23,26,32,35],"text":"Many people want to **lead a healthy lifestyle**, but lasting change often begins with simple daily choices. We can **have a balanced diet** by choosing different kinds of food and trying to **eat nutritious food** rather than relying on snacks. It also helps to **cut down on sugar** and **take regular exercise**. Adults who smoke may need professional support to **give up smoking**. Good hygiene, clean water and vaccination programmes can help **prevent infectious diseases**, while recommended vaccinations can **protect against flu**. Over time, better living conditions and access to healthcare may **improve life expectancy** across a population. No single habit guarantees perfect health, but small improvements can make daily life healthier and more enjoyable.","summary":"Các thói quen dinh dưỡng, vận động và phòng bệnh góp phần xây dựng lối sống lành mạnh.","nwords":115,"vi_full":"Nhiều người muốn duy trì lối sống lành mạnh, nhưng sự thay đổi bền vững thường bắt đầu từ những lựa chọn đơn giản hằng ngày. Chúng ta có thể có chế độ ăn cân đối bằng cách chọn nhiều loại thực phẩm khác nhau và cố gắng ăn thức ăn giàu dinh dưỡng thay vì chỉ ăn đồ ăn vặt. Giảm lượng đường tiêu thụ và tập thể dục đều đặn cũng rất có ích. Người trưởng thành hút thuốc có thể cần sự hỗ trợ chuyên môn để bỏ thuốc lá. Vệ sinh tốt, nước sạch và các chương trình tiêm chủng có thể giúp ngăn ngừa bệnh truyền nhiễm; những loại vắc-xin được khuyến cáo cũng có thể giúp phòng bệnh cúm. Theo thời gian, điều kiện sống tốt hơn và khả năng tiếp cận dịch vụ y tế có thể góp phần nâng cao tuổi thọ trung bình của người dân. Không có thói quen riêng lẻ nào bảo đảm sức khỏe hoàn hảo, nhưng những cải thiện nhỏ có thể giúp cuộc sống hằng ngày khỏe mạnh và dễ chịu hơn."},{"sheet":3,"grade":11,"unit":"Unit 1 · A Long and Healthy Life","title":"Getting Fit Without Overdoing It","vi_title":"Rèn thể lực đúng cách","ids":[2,4,7,16,17,20,27,29,33],"text":"When students want to **improve physical fitness**, they sometimes try to do too much too quickly. A sensible plan should include rest as well as activities that **build muscle strength**. For example, beginners can learn to **do press-ups** with correct technique and increase the number gradually. They should also **limit screen time** before bed and **get enough sleep**. Paying attention to food matters, too: it is wise to **check food ingredients**, especially when you have an allergy. Anyone can **suffer from food poisoning** after eating unsafe food, and someone with severe symptoms may need to **receive medical treatment**. After an infection or injury, it takes time to **recover from an illness**. The best fitness plan is one that is safe and sustainable.","summary":"Luyện tập an toàn cần kết hợp nghỉ ngơi, dinh dưỡng và chăm sóc sức khỏe khi bị bệnh.","nwords":122,"vi_full":"Khi muốn cải thiện thể lực, đôi khi học sinh cố gắng tập quá nhiều trong thời gian quá ngắn. Một kế hoạch hợp lý nên bao gồm cả nghỉ ngơi lẫn các hoạt động tăng sức mạnh cơ bắp. Chẳng hạn, người mới tập có thể học cách chống đẩy đúng kỹ thuật và tăng dần số lần thực hiện. Các em cũng nên hạn chế thời gian dùng màn hình trước khi đi ngủ và ngủ đủ giấc. Chú ý đến thức ăn cũng rất quan trọng: kiểm tra thành phần thực phẩm là việc khôn ngoan, đặc biệt khi bạn bị dị ứng. Bất kỳ ai cũng có thể bị ngộ độc thực phẩm sau khi ăn đồ không an toàn; người có triệu chứng nghiêm trọng có thể cần được điều trị y tế. Sau khi bị nhiễm trùng hoặc chấn thương, cơ thể cần thời gian để hồi phục. Kế hoạch rèn luyện tốt nhất là kế hoạch an toàn và có thể duy trì lâu dài."},{"sheet":3,"grade":11,"unit":"Unit 2 · The Generation Gap","title":"Different Ages, Shared Values","vi_title":"Khác thế hệ, chung giá trị","ids":[3,6,9,11,12,18,22,24,34],"text":"In Viet Nam, some families choose to **live in an extended family**, while others live separately. People of different ages may **share common characteristics**, yet they do not always see things in the same way. Grandparents often **hold traditional views** about behaviour and family duties, while teenagers may prefer more freedom. To **understand generational differences**, both sides need to listen and **respect different opinions**. Honest conversations can **bridge the generation gap** and help families **resolve family conflicts** before disagreements become serious. Older relatives often **pass down cultural values** through stories and celebrations, and young people can introduce new ideas in return. Whatever their age, most family members **value honesty** and want to feel understood.","summary":"Khác biệt quan điểm giữa các thế hệ có thể được thu hẹp bằng giao tiếp và tôn trọng.","nwords":114,"vi_full":"Ở Việt Nam, một số gia đình lựa chọn sống trong gia đình nhiều thế hệ, còn những gia đình khác sống riêng. Người thuộc các độ tuổi khác nhau có thể có chung một số đặc điểm nhưng không phải lúc nào cũng nhìn nhận mọi việc giống nhau. Ông bà thường giữ những quan điểm truyền thống về cách ứng xử và trách nhiệm gia đình, trong khi thanh thiếu niên có thể muốn tự do hơn. Để hiểu những khác biệt giữa các thế hệ, cả hai bên cần lắng nghe và tôn trọng những ý kiến khác nhau. Các cuộc trò chuyện chân thành có thể thu hẹp khoảng cách thế hệ và giúp gia đình giải quyết mâu thuẫn trước khi bất đồng trở nên nghiêm trọng. Người lớn tuổi thường truyền lại các giá trị văn hóa qua những câu chuyện và dịp lễ, còn người trẻ có thể chia sẻ những ý tưởng mới. Dù ở độ tuổi nào, phần lớn thành viên gia đình đều coi trọng tính trung thực và muốn được thấu hiểu."},{"sheet":3,"grade":11,"unit":"Unit 2 · The Generation Gap / Unit 8 · Becoming Independent","title":"Learning to Stand on Your Own Feet","vi_title":"Học cách tự lập","ids":[5,10,14,19,25,28,30,31,36],"text":"Children who **grow up in a nuclear family** can learn important life skills at home, just like children in larger families. As they get older, they want to **become more independent** and **take responsibility** for their decisions. Teenagers sometimes **have an argument with parents** about study plans or free time, but disagreement does not have to damage a relationship. Instead, they can **come up with new ideas** and discuss them respectfully. They should also **learn from older generations**, who have dealt with many changes in life. To **cope with difficulties**, students need patience and the confidence to ask for help. Learning to **adapt to changes** and **avoid unhealthy habits** makes independence a gradual process rather than a sudden break from family support.","summary":"Tự lập không có nghĩa là tách khỏi gia đình mà là học trách nhiệm và cách giải quyết vấn đề.","nwords":122,"vi_full":"Những đứa trẻ lớn lên trong gia đình hạt nhân cũng có thể học các kỹ năng sống quan trọng tại nhà, giống như trẻ ở gia đình đông thành viên hơn. Khi lớn lên, các em muốn tự lập hơn và chịu trách nhiệm về những quyết định của mình. Thanh thiếu niên đôi khi tranh cãi với cha mẹ về kế hoạch học tập hoặc thời gian rảnh, nhưng bất đồng không nhất thiết làm tổn hại mối quan hệ. Thay vào đó, các em có thể nghĩ ra ý tưởng mới và trao đổi một cách tôn trọng. Các em cũng nên học hỏi từ các thế hệ đi trước, những người đã trải qua nhiều thay đổi trong cuộc sống. Để ứng phó với khó khăn, học sinh cần sự kiên nhẫn và tự tin khi nhờ giúp đỡ. Học cách thích nghi với thay đổi và tránh những thói quen không lành mạnh giúp quá trình tự lập diễn ra dần dần, chứ không phải là sự tách rời đột ngột khỏi sự hỗ trợ của gia đình."},{"sheet":4,"grade":11,"unit":"Unit 3 · Cities of the Future / Unit 5 · Global Warming","title":"A Greener City Starts Today","vi_title":"Thành phố xanh bắt đầu từ hôm nay","ids":[5,7,8,9,10,18,19,25,31],"text":"Designing **sustainable cities** means thinking about the environment as well as the people who live there. City leaders can **create green spaces** where residents relax, exercise and meet their neighbours. To **protect the environment**, they also need plans to **reduce air pollution** from traffic and industry. Schools can **monitor energy use** and teach students to switch off unused equipment. Buildings may use solar power and other forms of **renewable energy**. Families can **use clean energy** where it is available and choose transport options that **reduce our carbon footprint**. These measures alone will not solve every urban problem, but together they can **make cities more liveable** for future generations.","summary":"Quy hoạch xanh, giao thông sạch và năng lượng tái tạo góp phần làm đô thị đáng sống hơn.","nwords":108,"vi_full":"Thiết kế các thành phố bền vững có nghĩa là quan tâm đến môi trường cũng như những người sinh sống tại đó. Lãnh đạo thành phố có thể tạo thêm không gian xanh để cư dân nghỉ ngơi, tập thể dục và gặp gỡ hàng xóm. Để bảo vệ môi trường, họ cũng cần những kế hoạch giảm ô nhiễm không khí do giao thông và công nghiệp gây ra. Các trường học có thể theo dõi lượng năng lượng sử dụng và dạy học sinh tắt thiết bị khi không dùng. Các tòa nhà có thể sử dụng điện mặt trời và những dạng năng lượng tái tạo khác. Các gia đình có thể dùng năng lượng sạch ở nơi có điều kiện và lựa chọn cách đi lại giúp giảm lượng khí thải các-bon do hoạt động của mình tạo ra. Chỉ riêng những biện pháp này không thể giải quyết mọi vấn đề đô thị, nhưng kết hợp lại, chúng có thể giúp các thành phố trở nên đáng sống hơn cho những thế hệ tương lai."},{"sheet":4,"grade":11,"unit":"Unit 3 · Cities of the Future","title":"Moving Around a Smarter City","vi_title":"Di chuyển trong thành phố thông minh","ids":[12,14,15,17,21,27,29,30,35],"text":"People who **travel during rush hour** know how frustrating crowded roads can be. One solution is to **improve public transport** so that more residents choose to **use public transport** instead of driving everywhere. Cities can also **build more cycle paths** and **provide more pedestrian zones** near schools and shopping areas. Safer streets will **encourage walking and cycling**, especially for short journeys. Modern traffic lights can **control traffic flow** at busy intersections and help **reduce traffic jams**. However, changes to roads and buses must be part of a larger plan to **improve urban infrastructure**. A successful transport system should be affordable, accessible and convenient for people of all ages.","summary":"Đô thị tương lai cần giao thông công cộng thuận tiện, đường đi bộ và xe đạp an toàn.","nwords":108,"vi_full":"Những người đi lại vào giờ cao điểm đều hiểu đường sá đông đúc gây khó chịu đến mức nào. Một giải pháp là cải thiện giao thông công cộng để nhiều cư dân chọn sử dụng phương tiện công cộng thay vì đi ô tô khắp nơi. Các thành phố cũng có thể xây thêm làn đường dành cho xe đạp và bố trí thêm khu vực dành cho người đi bộ gần trường học, khu mua sắm. Đường phố an toàn hơn sẽ khuyến khích người dân đi bộ và đạp xe, đặc biệt cho những quãng đường ngắn. Đèn giao thông hiện đại có thể điều tiết luồng xe tại các giao lộ đông đúc và giúp giảm ùn tắc. Tuy nhiên, những thay đổi về đường sá và xe buýt phải nằm trong một kế hoạch lớn hơn nhằm cải thiện cơ sở hạ tầng đô thị. Một hệ thống giao thông thành công phải có chi phí hợp lý, dễ tiếp cận và thuận tiện cho mọi lứa tuổi."},{"sheet":4,"grade":11,"unit":"Unit 3 · Cities of the Future","title":"Smart Technology, Real Responsibilities","vi_title":"Công nghệ thông minh và trách nhiệm thực tế","ids":[2,4,6,11,20,22,24,26,36],"text":"Some modern buildings use **computer-controlled systems** to adjust lighting and temperature. Engineers **install smart sensors** that **collect real-time data** about how the building is used. With the right settings, these systems can **operate efficiently** and save resources. Technology companies also **develop green technologies** that may **improve the quality of life** in crowded cities. For example, residents might **use a card reader** to enter a shared workspace safely. Yet smart technology raises important questions: councils must **protect people's privacy** when storing information. Some residents **fear the loss of privacy** if cameras and sensors follow their movements. A smart city should therefore be efficient and transparent, not simply full of digital devices.","summary":"Công nghệ thông minh cần đi đôi với bảo vệ dữ liệu và quyền riêng tư.","nwords":111,"vi_full":"Một số tòa nhà hiện đại sử dụng hệ thống điều khiển bằng máy tính để điều chỉnh ánh sáng và nhiệt độ. Các kỹ sư lắp đặt cảm biến thông minh để thu thập dữ liệu theo thời gian thực về cách tòa nhà được sử dụng. Khi được cài đặt phù hợp, những hệ thống này có thể vận hành hiệu quả và tiết kiệm tài nguyên. Các công ty công nghệ cũng phát triển công nghệ xanh nhằm cải thiện chất lượng cuộc sống ở những thành phố đông đúc. Chẳng hạn, cư dân có thể sử dụng thiết bị đọc thẻ để vào không gian làm việc chung một cách an toàn. Tuy nhiên, công nghệ thông minh đặt ra các câu hỏi quan trọng: chính quyền đô thị phải bảo vệ quyền riêng tư của người dân khi lưu trữ thông tin. Một số cư dân lo ngại mất quyền riêng tư nếu camera và cảm biến theo dõi mọi hoạt động của họ. Vì vậy, một thành phố thông minh phải vừa hiệu quả vừa minh bạch, chứ không chỉ đơn thuần có nhiều thiết bị số."},{"sheet":4,"grade":11,"unit":"Unit 3 · Cities of the Future","title":"Building a Community in a High-Rise City","vi_title":"Xây dựng cộng đồng trong đô thị cao tầng","ids":[1,3,13,16,23,28,32,33,34],"text":"When young people **move to an urban centre** for study or work, they may feel excited but also lonely. Many choose to **live in a high-rise building**, where it is easy to see hundreds of people without knowing anyone. City planners can **design roof gardens** as shared spaces that **encourage social interaction**. Residents can **interact with neighbours** while growing vegetables or learning how to **save energy** at home. Community events help newcomers **meet city dwellers** of different ages and **develop a sense of community**. At the same time, local authorities need reliable systems to **manage public services**, including water, waste and public transport. The future city should offer not only modern buildings but also meaningful human connections.","summary":"Đô thị hiện đại cần không gian chung và dịch vụ công tốt để mọi người gắn kết.","nwords":117,"vi_full":"Khi người trẻ chuyển đến trung tâm đô thị để học tập hoặc làm việc, họ có thể vừa háo hức vừa cảm thấy cô đơn. Nhiều người chọn sống trong một tòa nhà cao tầng, nơi họ có thể nhìn thấy hàng trăm người nhưng không quen biết ai. Các nhà quy hoạch đô thị có thể thiết kế vườn trên mái làm không gian chung để khuyến khích giao tiếp xã hội. Cư dân có thể tương tác với hàng xóm khi cùng trồng rau hoặc học cách tiết kiệm năng lượng tại nhà. Các sự kiện cộng đồng giúp người mới đến gặp gỡ cư dân thành thị ở nhiều độ tuổi và hình thành cảm giác gắn bó với cộng đồng. Đồng thời, chính quyền địa phương cần hệ thống đáng tin cậy để quản lý các dịch vụ công cộng, bao gồm cấp nước, xử lý rác thải và giao thông công cộng. Thành phố tương lai không chỉ nên có những tòa nhà hiện đại mà còn phải mang lại các mối liên kết có ý nghĩa giữa con người với nhau."}]</script>

<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('corpus').textContent);
const PASSAGES=JSON.parse(document.getElementById('passages').textContent);
const RECORDED=JSON.parse(document.getElementById('passage-recordings').textContent);
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sheet=1,mode='board',showVi=true,search='',checked={1:false,2:false,3:false,4:false},chosen={1:[],2:[],3:[],4:[]};
let readingIndex={1:0,2:0,3:0,4:0},showReadingExamples=false,showFullTranslation=true;
try{let val=JSON.parse(localStorage.getItem('abhiuyen_4_sheets_selection_v1')||'{}');for(let n=1;n<=4;n++){if(Array.isArray(val[n]))chosen[n]=[...new Set(val[n].filter(v=>Number.isInteger(v)&&v>=1&&v<=36))];}}catch(e){}
const audio=$('audio');let fragment=null,playMode='none';let toastTimer;
const recordedPlayer=new Audio(); recordedPlayer.preload='metadata';let recordedIndex=-1,readingSpeed=1;
const sec=t=>{t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function store(){try{localStorage.setItem('abhiuyen_4_sheets_selection_v1',JSON.stringify(chosen))}catch(e){}}
function selectedCount(){return chosen[sheet].length}
function stopRecorded(reset=false){
 recordedPlayer.pause();
 if(reset){recordedIndex=-1;recordedPlayer.removeAttribute('src');recordedPlayer.load();}
 updateRecordedUI();
}
function updateRecordedUI(){
 const btn=$('recordedPlay');if(!btn)return;
 const ix=PASSAGES.indexOf(PASSAGES.filter(p=>p.sheet===sheet)[readingIndex[sheet]]);
 const isThis=ix===recordedIndex, playing=isThis&&!recordedPlayer.paused;
 btn.textContent=playing?'❚❚ Tạm dừng':'▶ Nghe audio đoạn này';
 const progress=$('recordedSeek'),position=$('recordedPosition');
 if(progress){const duration=isThis&&Number.isFinite(recordedPlayer.duration)?recordedPlayer.duration:0;progress.value=duration?Math.round(1000*recordedPlayer.currentTime/duration):0;}
 if(position){const duration=isThis&&Number.isFinite(recordedPlayer.duration)?recordedPlayer.duration:0;position.textContent=sec(isThis?recordedPlayer.currentTime:0)+' / '+sec(duration);}
}
function playRecorded(ix,restart=false){
 if(!RECORDED[ix]){speak(PASSAGES[ix].text.replace(/\*\*/g,''));return;}
 audio.pause();window.speechSynthesis?.cancel?.();
 if(ix===recordedIndex&&!restart&&!recordedPlayer.paused){recordedPlayer.pause();updateRecordedUI();return;}
 if(ix!==recordedIndex){recordedPlayer.pause();recordedIndex=ix;recordedPlayer.src=RECORDED[ix];recordedPlayer.load();}
 if(restart||!Number.isFinite(recordedPlayer.duration)||recordedPlayer.currentTime>=recordedPlayer.duration-.1){recordedPlayer.currentTime=0;}
 recordedPlayer.playbackRate=readingSpeed;
 recordedPlayer.play().catch(()=>toast('Không thể phát bản ghi âm này. Hãy thử mở bằng Chrome hoặc Edge.'));
 updateRecordedUI();
}
function setSheet(n){ if(sheet===n)return; stopRecorded(true);window.speechSynthesis?.cancel?.(); audio.pause();fragment=null;playMode='none';sheet=n;search='';audio.src=DATA[n+'_audio'];audio.load();audio.playbackRate=Number($('speed').value);$('seek').value='0';updatePlaybackUI();render();}
function setMode(m){if(mode===m)return;stopRecorded(true);window.speechSynthesis?.cancel?.();mode=m;render()}
function updateTabs(){document.querySelectorAll('[data-sheet]').forEach(b=>{b.classList.toggle('active',+b.dataset.sheet===sheet);b.setAttribute('aria-current',+b.dataset.sheet===sheet?'page':'false')});document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('trackLabel').textContent='AUDIO GỐC · SHEET 0'+sheet;}
function updatePlaybackUI(){let dur=audio.duration||[0,74.04,80.92,79.4,101.68][sheet];$('timer').textContent=sec(audio.currentTime)+' / '+sec(dur);$('seek').value=dur?Math.round(audio.currentTime/dur*1000):0;let playing=!audio.paused; $('fullPlay').textContent=(playing?'❚❚  Tạm dừng':'▶  Nghe toàn bài');$('audioStatus').textContent=playing?(fragment?(mode==='board'?'Đang phát một cụm từ':`Đang phát cụm ${String(fragment.n).padStart(2,'0')}`):'Đang phát audio toàn bài'):'Sẵn sàng · 36 cụm từ'; document.querySelectorAll('.study-card').forEach(c=>c.classList.toggle('playing',!!fragment&&playing&&+c.dataset.n===fragment.n));}
function playFull(restart=false){stopRecorded();window.speechSynthesis?.cancel?.();if(!restart&&!audio.paused&&playMode==='full'){audio.pause();return}if(!restart&&audio.paused&&playMode==='full'&&audio.currentTime>0&&audio.currentTime<audio.duration-.1){audio.play().catch(()=>toast('Trình duyệt không cho phát audio. Hãy thử bấm lại.'));return}fragment=null;playMode='full';audio.currentTime=0;audio.play().catch(()=>toast('Không phát được audio. Hãy mở file bằng Chrome hoặc Edge.'));updatePlaybackUI()}
function playPhrase(n){stopRecorded();window.speechSynthesis?.cancel?.();const [start,end]=DATA[sheet+'_time'][n-1];fragment={n,end};playMode='fragment';audio.pause();audio.currentTime=start;audio.playbackRate=Number($('speed').value);audio.play().catch(()=>toast('Không phát được cụm từ này.'));updatePlaybackUI()}
function speak(text){stopRecorded();if(!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc ví dụ. Audio cụm từ gốc vẫn sử dụng được.');return}audio.pause();window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88*Number($('speed').value);u.pitch=1;let voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('en-gb'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;u.onerror=()=>toast('Thiết bị chưa có giọng đọc tiếng Anh. Bạn vẫn có thể nghe các cụm từ từ audio gốc.');window.speechSynthesis.speak(u)}
function renderBoard(){let rows=DATA[sheet+'_layout'];let items=DATA[String(sheet)];const taken=chosen[sheet];const showAnswers=checked[sheet];let html=`<div class="workhead"><div><h2>LISTEN • CIRCLE • NUMBER <span style="color:var(--gold);font-size:13px">SHEET 0${sheet}</span></h2><p>Listen. Circle each phrase you hear and write its number. Bấm vào cụm từ theo thứ tự được đọc.</p></div><div class="head-actions"><label class="switch-label"><input id="showVi" type="checkbox" ${showVi?'checked':''}>Hiện nghĩa tiếng Việt</label><button class="btn gold" type="button" id="printBoard">⎙ In phiếu</button></div></div><div class="board" role="group" aria-label="36 cụm từ nghe và đánh số">`;
for(const row of rows){html+=`<div class="phrase-row" style="--cols:${row.length}">`;for(const n of row){const item=items[n-1];const position=taken.indexOf(n);const selected=position>=0;const wrong=showAnswers&&(!selected||position+1!==n);const state=showAnswers?(wrong?'wrong':'correct'):'';html+=`<button class="phrase-button ${selected?'selected':''} ${showAnswers?'checked '+state:''}" data-pick="${n}" type="button" aria-pressed="${selected}"><span class="pin">${String(position+1).padStart(2,'0')}</span><span class="en">${escapeHtml(item.en)}</span>${showVi?`<span class="vi">${escapeHtml(item.vi)}</span>`:''}${showAnswers&&wrong?`<span class="actual">Đáp án: ${String(n).padStart(2,'0')}</span>`:''}</button>`}html+='</div>'}
html+=`</div><div class="board-bottom"><div class="board-count" id="selectionCount">Đã đánh số: <b>${taken.length} / 36</b></div><div class="head-actions"><button id="undo" class="btn" type="button" ${!taken.length?'disabled':''}>↶ Bỏ lượt cuối</button><button id="reset" class="btn" type="button">Làm lại</button><button id="check" class="btn primary" type="button">✓ Kiểm tra thứ tự</button></div></div>`;
if(showAnswers){let correct=taken.filter((n,i)=>n===i+1).length;html+=`<div class="result" role="status"><strong>Kết quả: ${correct} / 36 đúng vị trí.</strong> ${taken.length<36?`Bạn đã chọn ${taken.length} / 36 cụm.`:'Đã đánh số đủ 36 cụm.'} Số màu đỏ bên dưới là thứ tự chính xác trong audio. Chuyển sang <strong>Học cụm từ & ví dụ</strong> để nghe lại từng mục.</div>`}
return html}
function renderStudy(){let all=DATA[String(sheet)];let filtered=all.filter(x=>(x.en+' '+x.vi+' '+x.a+' '+x.b).toLocaleLowerCase().includes(search.toLocaleLowerCase()));let html=`<div class="workhead"><div><h2>PHRASES IN CONTEXT <span style="color:var(--gold);font-size:13px">SHEET 0${sheet}</span></h2><p>Danh sách theo đúng thứ tự giọng đọc gốc · Bấm nghe từng cụm và xem hai ví dụ trong ngữ cảnh.</p></div><div class="head-actions"><button id="printStudy" class="btn gold" type="button">⎙ In tài liệu</button></div></div><div class="study-controls"><input class="search" id="search" placeholder="Tìm cụm tiếng Anh, nghĩa Việt hoặc câu ví dụ..." type="search" value="${escapeHtml(search)}" aria-label="Tìm cụm từ"><span style="font-size:12px;color:var(--muted)" id="searchCount">${filtered.length} / 36 cụm</span></div><div class="cards">`;
for(const o of filtered){let n=o.n;html+=`<article class="study-card" data-n="${n}"><div class="card-title"><span class="numbox">${String(n).padStart(2,'0')}</span><span class="phrase-title">${escapeHtml(o.en)}</span></div><p class="card-vi">${escapeHtml(o.vi)}</p><div class="card-actions"><button class="btn small gold" data-phrase="${n}" type="button" aria-label="Nghe cụm ${escapeHtml(o.en)}">▶ &nbsp; Nghe cụm từ gốc</button></div><div class="examples"><div class="example"><span class="letter">A</span><span>${escapeHtml(o.a)}</span><button class="speaker" title="Nghe câu ví dụ A bằng giọng đọc trên thiết bị" aria-label="Nghe ví dụ A" data-speak="${n}:a">♫</button></div><div class="example"><span class="letter">B</span><span>${escapeHtml(o.b)}</span><button class="speaker" title="Nghe câu ví dụ B bằng giọng đọc trên thiết bị" aria-label="Nghe ví dụ B" data-speak="${n}:b">♫</button></div></div></article>`}
html+=`</div>${!filtered.length?'<p class="noresults">Không tìm thấy cụm từ phù hợp.</p>':''}`;return html}

function renderReading(){
 const chosenPassages=PASSAGES.filter(p=>p.sheet===sheet),active=readingIndex[sheet],p=chosenPassages[active];
 const globalIndex=PASSAGES.indexOf(p);
 const clean=p.text.replace(/\*\*/g,'');
 let marked=p.text.replace(/\*\*([^*]+)\*\*/g,(whole,phrase)=>{
   const match=DATA[String(sheet)].find(x=>x.en===phrase);
   if(!match)return escapeHtml(phrase);
   return `<button type="button" class="word-audio" data-phrase="${match.n}" title="Nghe cụm gốc · ${escapeHtml(match.vi)}" aria-label="Nghe: ${escapeHtml(match.en)}">${escapeHtml(phrase)}<span class="tiny-play" aria-hidden="true"> ▸</span></button>`;
 });
 let out=`<div class="reading-top"><div><div class="reading-kicker">READING · GRADE ${p.grade} · ${escapeHtml(p.unit)}</div><h2>English in Context <span style="color:var(--gold)">· 9 cụm/đoạn</span></h2><p>16 đoạn đọc song ngữ · Nghe bài và học 9 cụm từ trong mỗi đoạn.</p></div><div class="reading-counter">${String(active+1).padStart(2,'0')}<span> / 04</span></div></div>`;
 out+=`<nav class="reading-menu" aria-label="Chọn đoạn đọc">${chosenPassages.map((x,i)=>`<button type="button" class="reading-menu-btn ${i===active?'active':''}" data-passage="${i}"><span>ĐOẠN ${String(i+1).padStart(2,'0')}${RECORDED[PASSAGES.indexOf(x)]?'<span class="real-audio-tag">♫ AUDIO</span>':''}</span><strong>${escapeHtml(x.title)}</strong></button>`).join('')}</nav>`;
 out+=`<article class="reading-article"><div class="reading-tag">BÀI ĐỌC ${String(active+1).padStart(2,'0')} · ${p.nwords} WORDS · 9 TARGET PHRASES</div><h3>${escapeHtml(p.title)}</h3><div class="reading-subtitle">${escapeHtml(p.vi_title)}</div><div class="reading-content" lang="en">${marked}</div>${showFullTranslation?`<section class="full-translation" lang="vi"><div class="full-translation-label">BẢN DỊCH TIẾNG VIỆT</div><p>${escapeHtml(p.vi_full)}</p></section>`:''}${RECORDED[globalIndex]?`<section class="recorded-panel" aria-label="Nghe bài đọc giọng thu âm"><div class="recorded-heading"><strong>♫ LISTEN TO THE FULL PASSAGE</strong><span>Giọng đọc thu sẵn · Đoạn ${String(globalIndex+1).padStart(2,'0')}</span></div><div class="recorded-buttons"><button class="btn primary" type="button" id="recordedPlay" data-read="${globalIndex}">▶ Nghe audio đoạn này</button><button class="btn gold" type="button" data-restart-reading="${globalIndex}">↻ Nghe lại từ đầu</button><label>Tốc độ <select id="readingSpeed" aria-label="Tốc độ nghe đoạn"><option value="0.85" ${readingSpeed===.85?'selected':''}>0.85×</option><option value="1" ${readingSpeed===1?'selected':''}>1.00×</option><option value="1.15" ${readingSpeed===1.15?'selected':''}>1.15×</option><option value="1.3" ${readingSpeed===1.3?'selected':''}>1.30×</option></select></label></div><div class="recorded-progress"><input id="recordedSeek" type="range" min="0" max="1000" value="0" aria-label="Tua audio đoạn"><time id="recordedPosition">0:00 / 0:00</time></div></section>`:`<div class="recorded-panel"><div class="recorded-heading"><strong>♫ LISTEN TO THE FULL PASSAGE</strong><span>Nghe bằng giọng tiếng Anh trên thiết bị</span></div><div class="recorded-buttons"><button class="btn primary" type="button" data-read="${globalIndex}">♫ Đọc đoạn bằng giọng trình duyệt</button></div><div class="recorded-help"></div></div>`}<div class="reading-actions"><label class="switch-label"><input type="checkbox" id="fullTranslation" ${showFullTranslation?'checked':''}> Hiện bản dịch đầy đủ</label><label class="switch-label"><input type="checkbox" id="showVi" ${showVi?'checked':''}> Hiện nghĩa Việt</label><label class="switch-label"><input type="checkbox" id="readingExamples" ${showReadingExamples?'checked':''}> Hiện 2 ví dụ/cụm</label></div></article>`;
 out+=`<div class="reading-vocab-top"><h3>9 cụm từ trong đoạn</h3><span>Chạm ▶ để nghe chính giọng audio đã cung cấp</span></div>`;
 out+='<div class="reading-vocab">';
 for(const n of p.ids){const item=DATA[String(sheet)][n-1];
 out+=`<div class="reading-tile"><div class="reading-tile-row"><span class="tile-number">${String(n).padStart(2,'0')}</span><strong>${escapeHtml(item.en)}</strong><button type="button" class="reading-listen" data-phrase="${n}" aria-label="Nghe ${escapeHtml(item.en)}">▶</button></div>${showVi?`<div class="tile-vi">${escapeHtml(item.vi)}</div>`:''}${showReadingExamples?`<div class="tile-ex"><p><b>A</b> ${escapeHtml(item.a)}</p><p><b>B</b> ${escapeHtml(item.b)}</p><div class="tile-speakers"><button type="button" data-speak="${n}:a">♫ Ví dụ A</button><button type="button" data-speak="${n}:b">♫ Ví dụ B</button></div></div>`:''}</div>`;
 }
 out+='</div><div class="reading-foots"><button class="btn" type="button" data-passage="'+Math.max(0,active-1)+'" '+(active===0?'disabled':'')+'>← Đoạn trước</button><button class="btn primary" type="button" data-passage="'+Math.min(3,active+1)+'" '+(active===3?'disabled':'')+'>Đoạn tiếp →</button><button class="btn" type="button" id="printReading">⎙ In đoạn này</button></div>';
 out+='';
 return out;
}

function render(){updateTabs();let ws=$('workspace');ws.innerHTML=mode==='board'?renderBoard():mode==='study'?renderStudy():renderReading();updatePlaybackUI();updateRecordedUI()}
function togglePick(n){const a=chosen[sheet];let i=a.indexOf(n);if(i>=0){a.splice(i,1)}else{a.push(n)}checked[sheet]=false;store();render()}
$('sheetTabs').addEventListener('click',e=>{let b=e.target.closest('[data-sheet]');if(b)setSheet(+b.dataset.sheet)});
$('modeTabs').addEventListener('click',e=>{let b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});
$('workspace').addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el)return;
 if(el.hasAttribute('data-passage')){stopRecorded(true);window.speechSynthesis?.cancel?.();readingIndex[sheet]=+el.dataset.passage;render()}
 else if(el.hasAttribute('data-read')){let ix=+el.dataset.read;if(RECORDED[ix])playRecorded(ix);else speak(PASSAGES[ix].text.replace(/\*\*/g,''))}
 else if(el.hasAttribute('data-restart-reading'))playRecorded(+el.dataset.restartReading,true)
 else if(el.hasAttribute('data-pick'))togglePick(+el.dataset.pick);
 else if(el.hasAttribute('data-phrase'))playPhrase(+el.dataset.phrase);
 else if(el.hasAttribute('data-speak')){let [n,key]=el.dataset.speak.split(':');speak(DATA[String(sheet)][Number(n)-1][key])}
 else if(el.id==='undo'){chosen[sheet].pop();checked[sheet]=false;store();render()}
 else if(el.id==='reset'){if(chosen[sheet].length&& !confirm('Xóa toàn bộ số đã đánh dấu ở sheet này?'))return;chosen[sheet]=[];checked[sheet]=false;store();render()}
 else if(el.id==='check'){checked[sheet]=true;render();}
 else if(el.id==='printBoard'||el.id==='printStudy'||el.id==='printReading'){window.print()}
});
$('workspace').addEventListener('change',e=>{if(e.target.id==='showVi'){showVi=e.target.checked;render()}else if(e.target.id==='readingExamples'){showReadingExamples=e.target.checked;render()}else if(e.target.id==='fullTranslation'){showFullTranslation=e.target.checked;render()}});
$('workspace').addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value; // keep keyboard focus while re-rendering results via partial updates
 const cards=$('workspace').querySelector('.cards');if(!cards)return;
 const q=search.toLocaleLowerCase();let visible=0;
 cards.querySelectorAll('.study-card').forEach(c=>{let i=Number(c.dataset.n)-1;let o=DATA[String(sheet)][i];let show=(o.en+' '+o.vi+' '+o.a+' '+o.b).toLocaleLowerCase().includes(q);c.hidden=!show;if(show)visible++});$('searchCount').textContent=visible+' / 36 cụm';
 }});
$('workspace').addEventListener('change',e=>{if(e.target.id==='readingSpeed'){readingSpeed=Number(e.target.value);recordedPlayer.playbackRate=readingSpeed;}});
$('workspace').addEventListener('input',e=>{if(e.target.id==='recordedSeek'&&recordedIndex>=0&&recordedPlayer.duration&&Number.isFinite(recordedPlayer.duration)){recordedPlayer.currentTime=Number(e.target.value)/1000*recordedPlayer.duration;updateRecordedUI();}});
recordedPlayer.addEventListener('timeupdate',updateRecordedUI);
recordedPlayer.addEventListener('loadedmetadata',updateRecordedUI);
recordedPlayer.addEventListener('play',updateRecordedUI);
recordedPlayer.addEventListener('pause',updateRecordedUI);
recordedPlayer.addEventListener('ended',updateRecordedUI);
$('fullPlay').addEventListener('click',()=>playFull());$('restart').addEventListener('click',()=>playFull(true));
$('speed').addEventListener('change',e=>{audio.playbackRate=Number(e.target.value);toast('Tốc độ đọc: '+e.target.value+'×')});
$('seek').addEventListener('input',e=>{if(!audio.duration)return;fragment=null;playMode='full';audio.currentTime=Number(e.target.value)/1000*audio.duration;updatePlaybackUI()});
audio.addEventListener('timeupdate',()=>{if(fragment&&audio.currentTime>=fragment.end){audio.pause();fragment=null;playMode='none'}updatePlaybackUI()});
audio.addEventListener('loadedmetadata',updatePlaybackUI);audio.addEventListener('play',updatePlaybackUI);audio.addEventListener('pause',updatePlaybackUI);audio.addEventListener('ended',()=>{fragment=null;playMode='none';updatePlaybackUI()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();playFull()}});
// Assign the embedded MP3 directly: this document can run as a stand-alone .html file without Internet.
audio.src=DATA['1_audio'];audio.load();render();
})();
</script>
</body></html>
